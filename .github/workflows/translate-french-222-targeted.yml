name: Complete Geeklog 2.2.2 French translation

on:
  push:
    paths: ['.github/workflows/translate-french-222-targeted.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Translate dynamic strings and configuration labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('core/2.2.2/french_france_utf-8.php')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected text not found:\n' + old)
              s = s.replace(old, new, 1)

          # Dynamic / interpolated strings left untranslated by the safe constant-value pass.
          replace_once("'loginform' => \"<a href=\\\"{$_CONF['site_url']}/users.php\\\">Login Here</a>\",",
                       "'loginform' => \"<a href=\\\"{$_CONF['site_url']}/users.php\\\">Se connecter ici</a>\",")
          replace_once("6 => 'This site requires you to be logged in to post a comment. If you have an account already (or need to create one), please <a href=\"%s\">login here</a>.'",
                       "6 => 'Vous devez être connecté pour publier un commentaire. Si vous possédez déjà un compte ou souhaitez en créer un, veuillez <a href=\"%s\">vous connecter ici</a>.'")
          replace_once("'instr_line6' => 'When logged in as a user your comments will be linked to your account and you can specify if you would like notifications of any replies.'",
                       "'instr_line6' => 'Lorsque vous êtes connecté, vos commentaires sont associés à votre compte et vous pouvez choisir de recevoir des notifications en cas de réponse.'")

          replacements = {
              "'email_convert_remote' => \"Your {$_CONF['site_name']} remote account has been converted to a local account. To continue to use your account, you must login using the information below. Please save this mail for further reference.\"":
                  "'email_convert_remote' => \"Votre compte distant {$_CONF['site_name']} a été converti en compte local. Pour continuer à l’utiliser, connectez-vous avec les informations ci-dessous. Conservez cet email pour référence ultérieure.\"",
              "'cookietimeout_tooltip' => \"This site will remember you are logged in from the device you are currently using regardless of if your account has been logged out automatically due to no activity. Accounts are logged out after being inactive for %s seconds (this is called the \\\"User Session Timeout\\\"). When \\\"Remember Me For\\\" is set for your account it will include the time you select here PLUS the \\\"User Session timeout\\\".\"":
                  "'cookietimeout_tooltip' => \"Ce site mémorisera votre connexion sur l’appareil actuellement utilisé, même si votre session est automatiquement fermée pour inactivité. Les comptes sont déconnectés après %s secondes d’inactivité (délai d’expiration de session). La durée « Se souvenir de moi pendant » s’ajoute à ce délai de session.\"",
              "170 => \"Admin at {$_CONF['site_name']} changed the password of your account as follows.  Please save this mail for further reference.\"":
                  "170 => \"Un administrateur de {$_CONF['site_name']} a modifié le mot de passe de votre compte comme indiqué ci-dessous. Conservez cet email pour référence ultérieure.\"",
              "'user_remote_login_desc_long' => 'Click on one of the button(s) below to login and/or register via an account you have on another supported remote service. Please note, you must have an account on the remote service. If you are creating a new account on this website, then the remote service may ask you to give this website permissions to access information like your name, email address, and profile photo.'":
                  "'user_remote_login_desc_long' => 'Cliquez sur l’un des boutons ci-dessous pour vous connecter ou vous inscrire avec un compte d’un service distant pris en charge. Vous devez disposer d’un compte sur ce service. Lors de la création d’un nouveau compte sur ce site, le service distant peut vous demander d’autoriser l’accès à certaines informations, comme votre nom, votre adresse email et votre photo de profil.'",
              "'remote_register_instructions' => \"<strong>Please note:</strong> To register and create an account via Remote Login, please visit the <a href=\\\"{$_CONF['site_url']}/users.php\\\" rel=\\\"nofollow\\\">User Login</a>.\"":
                  "'remote_register_instructions' => \"<strong>Remarque :</strong> pour vous inscrire et créer un compte via une connexion distante, consultez la page <a href=\\\"{$_CONF['site_url']}/users.php\\\" rel=\\\"nofollow\\\">Connexion utilisateur</a>.\"",
              "'lang_tfa_user_edit_desc' => 'You are only allowed to disable Two Factor Authentication (2FA) from this form if needed (like the user does not have their backup codes). It should not be enabled by Admins as the user themselves are required to enable and setup 2FA from their Account, including the Google Authenticator App for their phone and coping the backup codes.'":
                  "'lang_tfa_user_edit_desc' => 'Depuis ce formulaire, vous pouvez uniquement désactiver l’authentification à deux facteurs (2FA) si nécessaire, par exemple lorsque l’utilisateur ne dispose plus de ses codes de secours. Les administrateurs ne doivent pas l’activer à la place de l’utilisateur : celui-ci doit configurer lui-même la 2FA depuis son compte, installer Google Authenticator et conserver ses codes de secours.'",
              "45 => \"This is a message sent from {$_CONF['site_name']} by %s. Any replies will need to be sent to the email address: %s\"":
                  "45 => \"Ce message a été envoyé depuis {$_CONF['site_name']} par %s. Toute réponse doit être envoyée à l’adresse email : %s\"",
              "46 => \"To unsubscribe from the Daily Digest, login to {$_CONF['site_name']} at {$_CONF['site_url']}. Then visit the user settings page at {$_CONF['site_url']}/usersettings.php and view the Content Tab. You can then unsubscribe to the Daily Digest by deselecting all topics and saving your profile.\"":
                  "46 => \"Pour vous désabonner du résumé quotidien, connectez-vous à {$_CONF['site_name']} sur {$_CONF['site_url']}. Ouvrez ensuite {$_CONF['site_url']}/usersettings.php puis l’onglet Contenu. Désélectionnez toutes les catégories et enregistrez votre profil.\"",
              "5 => \"Overall Site Statistics for {$_CONF['site_name']}\"":
                  "5 => \"Statistiques générales du site {$_CONF['site_name']}\"",
              "'site_db_backup' => \"{$_CONF['site_name']} Database Backup\"":
                  "'site_db_backup' => \"Sauvegarde de la base de données de {$_CONF['site_name']}\"",
          }
          for old, new in replacements.items():
              replace_once(old, new)

          # Long constant strings still in English.
          long_replacements = {
              'This site will remember you are logged in from the device you are currently using regardless of if your account has been logged out automatically due to no activity. Accounts are logged out after being inactive for %s seconds (this is called the "User Session Timeout"). When "Remember Me For" is set for your account it will include the time you select here PLUS the "User Session timeout".':
                  'Ce site mémorisera votre connexion sur l’appareil actuellement utilisé, même si votre session est automatiquement fermée pour inactivité. Les comptes sont déconnectés après %s secondes d’inactivité. La durée « Se souvenir de moi pendant » s’ajoute à ce délai de session.',
              'You have previously updated your email address for your account but it still needs to be verified. Please check your email account for an email from %s that contains a verification link. Once you click on that link your new email address will be verified and your account will be updated to use it.<br /><br />If you wish you may update the new email to be verified with the email fields above or you can delete it.':
                  'Vous avez modifié l’adresse email de votre compte, mais elle doit encore être vérifiée. Consultez l’email envoyé par %s contenant le lien de vérification. Après avoir cliqué sur ce lien, la nouvelle adresse sera validée et utilisée pour votre compte.<br /><br />Vous pouvez également modifier l’adresse à vérifier à l’aide des champs ci-dessus ou la supprimer.',
              'To remove your account from our database, enter your current password into the above "Current Password", check the checkbox next to "Delete Option" below and click on "Save" . Please note that any articles and comments you posted under this account will <strong>not</strong> be deleted but show up as being posted by "Anonymous".':
                  'Pour supprimer votre compte de notre base de données, saisissez votre mot de passe actuel dans le champ « Mot de passe actuel », cochez l’option de suppression ci-dessous puis cliquez sur « Enregistrer ». Les articles et commentaires publiés avec ce compte ne seront <strong>pas</strong> supprimés ; ils seront attribués à « Anonyme ».',
              'To remove your remote account from our database, check the checkbox next to "Delete Option" below and click on "Save" . Please note that any articles and comments you posted under this account will <strong>not</strong> be deleted but show up as being posted by "Anonymous".':
                  'Pour supprimer votre compte distant de notre base de données, cochez l’option de suppression ci-dessous puis cliquez sur « Enregistrer ». Les articles et commentaires publiés avec ce compte ne seront <strong>pas</strong> supprimés ; ils seront attribués à « Anonyme ».',
              'When a remote account is converted to a local account, a password will be automatically generated. If the account does not have a confirmed email address, the account will be locked after it is converted since the user will have no way of retrieving the password. Once converted and if the account is active and has an email address the user will be emailed the password or they can request the password by using the forget password link from the Login page. For user accounts that do not have an active status and valid email you will have to manually notify the user of the account change and how to login.':
                  'Lorsqu’un compte distant est converti en compte local, un mot de passe est généré automatiquement. Si le compte ne possède pas d’adresse email confirmée, il sera verrouillé après la conversion car l’utilisateur ne pourra pas récupérer son mot de passe. Si le compte est actif et possède une adresse email valide, le mot de passe sera envoyé à l’utilisateur, qui pourra également en demander un nouveau depuis la page de connexion. Pour les comptes non actifs ou sans email valide, vous devrez informer manuellement l’utilisateur de la modification et de la procédure de connexion.',
              'The following template variables are available in <strong>Subject</strong> and <strong>Message</strong>: {uid}, {username}, {fullname}, {email}, {homepage}, {theme}, {language}, {location}, {lastgranted}, {lastlogin}, {site_url}, {site_name}, {site_slogan}, {owner_name}, {copyrightyear}, {site_mail}, {noreply_mail}':
                  'Les variables de template suivantes sont disponibles dans <strong>Objet</strong> et <strong>Message</strong> : {uid}, {username}, {fullname}, {email}, {homepage}, {theme}, {language}, {location}, {lastgranted}, {lastlogin}, {site_url}, {site_name}, {site_slogan}, {owner_name}, {copyrightyear}, {site_mail}, {noreply_mail}',
              'A verification message has been sent to your email address. Please click on the link in the email to confirm your email address and update your account. If you log into your account again before you verify your email address you will be asked again for a email address.<br /><br />Please note you have now been successfully logged out so you can complete this verification.':
                  'Un message de vérification a été envoyé à votre adresse email. Cliquez sur le lien qu’il contient pour confirmer votre adresse et mettre à jour votre compte. Si vous vous reconnectez avant d’avoir vérifié votre adresse, une adresse email vous sera à nouveau demandée.<br /><br />Vous avez été déconnecté afin de pouvoir terminer cette vérification.',
              'A list of users that belong to the group. Users lists here may belong directly to the group or are inherited from another group that has been added to this group.':
                  'Liste des utilisateurs appartenant au groupe. Les utilisateurs affichés peuvent appartenir directement à ce groupe ou être hérités d’un autre groupe qui lui a été ajouté.',
              'To create a new backup of your site database, select the "Do Backup" button below. This will backup all current Geeklog tables. You can download a copy of the backup from the main Database Administration Screen.':
                  'Pour créer une nouvelle sauvegarde de la base de données du site, cliquez sur le bouton « Sauvegarder » ci-dessous. Toutes les tables Geeklog actuelles seront sauvegardées. Vous pourrez télécharger une copie depuis la page principale d’administration de la base de données.',
              'InnoDB tables can provide better performance on large databases. Please <a href="http://dev.mysql.com/doc/refman/5.7/en/converting-tables-to-innodb.html" target="_blank">read up</a> on the benefits and drawbacks of InnoDB tables before you perform a conversion.':
                  'Les tables InnoDB peuvent offrir de meilleures performances sur les grandes bases de données. Avant d’effectuer une conversion, consultez <a href="http://dev.mysql.com/doc/refman/5.7/en/converting-tables-to-innodb.html" target="_blank">les avantages et inconvénients</a> des tables InnoDB.',
              'Select any tables you wish to exclude from the backup. Other options can be found in the Geeklog Configuration under the Database tab.':
                  'Sélectionnez les tables à exclure de la sauvegarde. Les autres options se trouvent dans la configuration de Geeklog, sous l’onglet Base de données.',
              'The security token for this operation has expired. Since you are a remote user you cannot re-authenticate, so you have lost your changes.':
                  'Le jeton de sécurité de cette opération a expiré. Comme vous êtes un utilisateur distant, vous ne pouvez pas vous authentifier à nouveau et vos modifications ont été perdues.',
              'There was an error after your account was re-authenticated. It is unclear if the operation you were performing was executed or not.':
                  'Une erreur s’est produite après la réauthentification de votre compte. Il est impossible de déterminer si l’opération en cours a été exécutée.',
              '[block:name class:block-autotag] - Displays a block. Class not required. Class specifies the css class and will wrap the block in a div. The class block-autotag will always be included with the div.':
                  '[block:name class:block-autotag] - Affiche un bloc. La classe est facultative ; elle indique la classe CSS utilisée pour entourer le bloc d’un élément div. La classe block-autotag est toujours ajoutée au div.',
              '[article: id alternate title] - Displays a link to an article using the Article Title as the title. An alternate title may be specified but is not required.':
                  '[article: id titre alternatif] - Affiche un lien vers un article en utilisant son titre. Un titre alternatif peut être indiqué, mais il est facultatif.',
              'You can only select topics you have Edit access to you (text is darker).':
                  'Vous pouvez sélectionner uniquement les catégories pour lesquelles vous disposez d’un accès en modification (texte plus foncé).',
              '[structureddata:schema_property]Property Value[/structureddata] - Adds a property to the structured data of the content that the autotag is embedded in.':
                  '[structureddata:propriété_schema]Valeur de la propriété[/structureddata] - Ajoute une propriété aux données structurées du contenu dans lequel l’autotag est inséré.'
          }
          for old, new in long_replacements.items():
              if old in s:
                  s = s.replace(old, new)

          # Likes strings containing HTML were not replaced by the constant-token pass.
          s = s.replace("'<br />%s Anonymous Users'", "'<br />%s utilisateurs anonymes'")
          s = s.replace("'<br />1 Anonymous User'", "'<br />1 utilisateur anonyme'")
          s = s.replace("'<br />+%s more Users'", "'<br />+%s utilisateurs supplémentaires'")

          # Human-readable keys of configuration option arrays. Technical values remain unchanged.
          config_lines = {
              5: "    5 => array('Texte brut' => 'plaintext', 'Format HTML' => 'html', 'Format Wiki' => 'wikitext'),",
              18: "    18 => array('Désactivé' => 0, 'Activé (correspondance exacte)' => 1, 'Activé (début de mot)' => 2, 'Activé (fragment de mot)' => 3),",
              19: "    19 => array('Google' => 'google', 'Tableau' => 'table'),",
              21: "    21 => array('HTML 4.01 transitionnel' => 'html401transitional', 'HTML 4.01 strict' => 'html401strict', 'XHTML 1.0 transitionnel' => 'xhtml10transitional', 'XHTML 1.0 strict' => 'xhtml10strict', 'HTML5' => 'html5', 'HTML5 avec syntaxe XHTML' => 'xhtml5'),",
              22: "    22 => array('Strict' => 'DENY', 'Même origine' => 'SAMEORIGIN', '(désactivé)' => ''),",
              24: "    24 => array('Contribuer' => 'contribute', 'Accueil' => 'home', 'Recherche avancée' => 'search', 'Répertoire' => 'directory', 'Connexion' => 'login', 'Mon compte' => 'prefs', 'Entrées des plugins' => 'plugins', 'Entrées personnalisées' => 'custom', 'Statistiques du site' => 'stats'),",
              25: "    25 => array('Nouveaux articles' => 'article', 'Nouveaux commentaires' => 'comment', 'Nouveaux trackbacks' => 'trackback', 'Nouveaux pingbacks' => 'pingback', 'Nouveaux utilisateurs' => 'user', 'Mises à jour des utilisateurs' => 'user_update'),",
              26: "    26 => array('G (Tous publics)' => 'G', 'PG (Accord parental souhaitable)' => 'PG', 'R (Restreint)' => 'R', 'X (Explicite)' => 'X'),",
              27: "    27 => array('Vues (croissant)' => 'hits|asc', 'Vues (décroissant)' => 'hits|desc', 'Date (croissant)' => 'date|asc', 'Date (décroissant)' => 'date|desc', 'Titre (croissant)' => 'title|asc', 'Titre (décroissant)' => 'title|desc', 'Auteur (croissant)' => 'uid|asc', 'Auteur (décroissant)' => 'uid|desc'),",
              30: "    30 => array('Début' => 'start', 'Fin' => 'end', 'Aucun' => 'none'),",
              31: "    31 => array('Plus récents en premier' => 'DESC', 'Plus anciens en premier' => 'ASC'),",
              32: "    32 => array('Désactivé' => 0, 'Pages d’articles uniquement' => 1, 'Articles et catégories' => 2),",
              33: "    33 => array('Désactivé' => 0, 'Activé' => 1, 'Activé (sans liens)' => 2, 'Activé (sans liens sortants)' => 3),",
              34: "    34 => array('grille' => 'grid', 'liste' => 'list'),",
              35: "    35 => array('par défaut' => 'default', 'Nom (croissant)' => 'NAME_ASC', 'Nom (décroissant)' => 'NAME_DESC', 'Type (croissant)' => 'TYPE_ASC', 'Type (décroissant)' => 'TYPE_DESC', 'Modification (croissant)' => 'MODIFIED_ASC', 'Modification (décroissant)' => 'MODIFIED_DESC'),",
              36: "    36 => array('Faux' => 'false', 'Page d’accueil uniquement' => 'frontpage', 'Page d’accueil et catégories' => 'frontpage_topics'),",
              37: "    37 => array('Désactivé' => 0, 'Activé (avec « index.php »)' => 1, 'Activé (sans « index.php »)' => 2),",
              38: "    38 => array('Personnage mystère' => 'mm', 'Identicon' => 'identicon', 'MonsterId' => 'monsterid', 'WAvatar' => 'wavatar', 'Rétro' => 'retro'),",
              39: "    39 => array('Aucun' => '', 'Page Web' => 'core-webpage', 'Article' => 'core-article', 'Article d’actualité' => 'core-newsarticle', 'Article de blog' => 'core-blogposting'),",
              40: "    40 => array('Faux' => 0, 'Utilisateurs et anonymes' => 1, 'Utilisateurs uniquement' => 2),",
              41: "    41 => array('Faux' => 0, 'J’aime et Je n’aime pas' => 1, 'J’aime uniquement' => 2),",
              42: "    42 => array('Aucun' => 0, 'Utiliser les réglages individuels des articles' => 1),",
              44: "    44 => array('Aucun accès' => 0, 'Lecture seule' => 2),",
          }
          start = s.index("$LANG_configselects['Core'] = array(")
          end = s.index("\n);", start)
          block = s[start:end]
          for idx, newline in config_lines.items():
              pattern = re.compile(rf'^\s*{idx}\s*=>\s*array\(.*\),?$', re.M)
              if not pattern.search(block):
                  raise SystemExit(f'Configselect line {idx} not found')
              block = pattern.sub(newline, block, count=1)
          s = s[:start] + block + s[end:]

          # Small editorial cleanup.
          s = s.replace("$LANG_MONTH_SHORT[12] = 'Decr';", "$LANG_MONTH_SHORT[12] = 'Déc';")

          path.write_text(s, encoding='utf-8')
          PY

          php -l core/2.2.2/french_france_utf-8.php

      - name: Commit targeted translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/2.2.2/french_france_utf-8.php
          git commit -m 'Complete Geeklog 2.2.2 French translation'
          git push
