          $tokens=token_get_all($code);
          $out=''; $prevSig=null; $changed=0;
          foreach($tokens as $tok){
            if(is_array($tok)){
              [$id,$text]=$tok;
              if($id===T_CONSTANT_ENCAPSED_STRING && $prevSig==='=>'){
                $value=null;
                @eval('$value='.$text.';');
                if(is_string($value) && array_key_exists($value,$tr)){
                  $text=var_export($tr[$value],true); $changed++;
                }
              }
              $out.=$text;
              if(!in_array($id,[T_WHITESPACE,T_COMMENT,T_DOC_COMMENT],true)) $prevSig=$id;
            } else {
              $out.=$tok;
              if(trim($tok)!=='') $prevSig=$tok;
            }
            if($prevSig===T_DOUBLE_ARROW) $prevSig='=>';
          }
          file_put_contents($file,$out);
          echo "Translated $changed constant values.\n";
          PHP
          php /tmp/translate.php
          php -l core/2.2.2/french_france_utf-8.php
