name: Check completed Geeklog 2.2.2 French language file

on:
  push:
    paths: ['.github/workflows/check-french-222-complete.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax, structure, placeholders and terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/validate-french-222-final.yml').read_text(encoding='utf-8').splitlines()
          collecting=False; php=[]
          for line in src:
              if line.strip()=="cat > /tmp/validate.php <<'PHP'": collecting=True; continue
              if collecting and line.strip()=='PHP': break
              if collecting: php.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/validate.php').write_text('\n'.join(php)+'\n',encoding='utf-8')
          PY
          php -l core/2.2.2/english_utf-8.php
          php -l core/2.2.2/french_france_utf-8.php
          php /tmp/validate.php
          python3 - <<'PY'
          from pathlib import Path
          text=Path('core/2.2.2/french_france_utf-8.php').read_text(encoding='utf-8').lower()
          forbidden=['prévisualiser','courriel','e-mail','télévers','rubrique']
          bad=[x for x in forbidden if x in text]
          if bad: raise SystemExit('Forbidden terminology remains: '+', '.join(bad))
          print('Terminology audit passed.')
          PY
