name: Validate Geeklog 2.2.2 French translation

on:
  push:
    paths:
      - 'core/2.2.2/english_utf-8.php'
      - 'core/2.2.2/french_france_utf-8.php'
      - '.github/workflows/lint-french-222.yml'
  pull_request:
    paths:
      - 'core/2.2.2/english_utf-8.php'
      - 'core/2.2.2/french_france_utf-8.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP language files
        run: |
          php -l core/2.2.2/english_utf-8.php
          php -l core/2.2.2/french_france_utf-8.php

      - name: Audit French terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('core/2.2.2/french_france_utf-8.php').read_text(encoding='utf-8').lower()
          forbidden = {
              'prévisualiser': 'use « Aperçu » for Preview',
              'courriel': 'use « email »',
              'e-mail': 'use « email »',
              'télévers': 'use « envoi » / « envoyer »',
              'rubrique': 'use « catégorie » for Geeklog Topic',
          }
          errors = [f'{term}: {rule}' for term, rule in forbidden.items() if term in text]
          if errors:
              raise SystemExit('Terminology inconsistencies:\n' + '\n'.join(errors))
          print('French terminology audit passed.')
          PY

      - name: Compare arrays, technical values and placeholders with English source
        run: |
          php <<'PHP'
          <?php
          define('XHTML', ' /');
          define('VERSION', '2.2.2');

          function loadLanguageFile($file)
          {
              $_CONF = array(
                  'site_url' => 'https://example.invalid',
                  'site_admin_url' => 'https://example.invalid/admin',
                  'site_name' => 'Example',
                  'commentspeedlimit' => 45,
                  'speedlimit' => 45,
                  'backup_path' => '/tmp/backups/',
                  'path_html' => '/tmp/',
                  'path_system' => '/tmp/',
                  'path_images' => '/tmp/',
                  'invalidloginattempts' => 5,
                  'invalidloginmaxtime' => 1200,
                  'theme_site_default' => 'modern_curve',
                  'theme' => 'modern_curve',
                  'min_theme_gl_version' => '2.2.2'
              );
              $_DB_mysqldump_path = '/usr/bin/mysqldump';
              $_DB_dbms = 'mysqli';
              include $file;
              $all = get_defined_vars();
              $result = array();
              foreach ($all as $name => $value) {
                  if ($name === 'MESSAGE' || strpos($name, 'LANG') === 0) {
                      $result[$name] = $value;
                  }
              }
              return $result;
          }

          function placeholders($value)
          {
              if (!is_string($value)) return array();
              preg_match_all('/%(?:\d+\$)?[-+0-9.]*[A-Za-z]/', $value, $m);
              sort($m[0]);
              return $m[0];
          }

          function normalizedValues($array)
          {
              $values = array_values($array);
              sort($values);
              return $values;
          }

          function compareValue($en, $fr, $path, &$errors)
          {
              if (is_array($en)) {
                  if (!is_array($fr)) {
                      $errors[] = "$path: French value is not an array";
                      return;
                  }
                  foreach ($en as $key => $value) {
                      if (!array_key_exists($key, $fr)) {
                          $errors[] = "$path: missing French key " . var_export($key, true);
                          continue;
                      }
                      compareValue($value, $fr[$key], $path . '[' . var_export($key, true) . ']', $errors);
                  }
                  foreach ($fr as $key => $value) {
                      if (!array_key_exists($key, $en)) {
                          $errors[] = "$path: extra French key " . var_export($key, true);
                      }
                  }
                  return;
              }
              if (placeholders($en) !== placeholders($fr)) {
                  $errors[] = "$path: placeholder mismatch EN=" . json_encode(placeholders($en)) . ' FR=' . json_encode(placeholders($fr));
              }
          }

          $en = loadLanguageFile('core/2.2.2/english_utf-8.php');
          $fr = loadLanguageFile('core/2.2.2/french_france_utf-8.php');
          $errors = array();

          foreach ($en as $name => $value) {
              if (!array_key_exists($name, $fr)) {
                  $errors[] = "Missing French variable \$$name";
                  continue;
              }
              if ($name === 'LANG_configselects') {
                  foreach ($value as $section => $selects) {
                      if (!isset($fr[$name][$section])) {
                          $errors[] = "Missing French configselect section $section";
                          continue;
                      }
                      foreach ($selects as $index => $options) {
                          if (!array_key_exists($index, $fr[$name][$section])) {
                              $errors[] = "Missing French configselect index $section/$index";
                              continue;
                          }
                          if (normalizedValues($options) !== normalizedValues($fr[$name][$section][$index])) {
                              $errors[] = "Configselect technical values differ at $section/$index";
                          }
                      }
                  }
                  continue;
              }
              compareValue($value, $fr[$name], '$' . $name, $errors);
          }
          foreach ($fr as $name => $value) {
              if (!array_key_exists($name, $en)) $errors[] = "Extra French variable \$$name";
          }
          if ($errors) {
              fwrite(STDERR, implode(PHP_EOL, $errors) . PHP_EOL);
              exit(1);
          }
          echo "French structure, technical values and placeholders match the English source.\n";
          PHP

      - name: Report strings still identical to English
        run: |
          php <<'PHP'
          <?php
          define('XHTML', ' /');
          define('VERSION', '2.2.2');
          function loadLanguageFile($file) {
              $_CONF = array(
                  'site_url'=>'https://example.invalid',
                  'site_admin_url'=>'https://example.invalid/admin',
                  'site_name'=>'Example',
                  'commentspeedlimit'=>45,
                  'speedlimit'=>45,
                  'backup_path'=>'/tmp/backups/',
                  'path_html'=>'/tmp/',
                  'path_system'=>'/tmp/',
                  'path_images'=>'/tmp/',
                  'invalidloginattempts'=>5,
                  'invalidloginmaxtime'=>1200,
                  'theme_site_default'=>'modern_curve',
                  'theme'=>'modern_curve',
                  'min_theme_gl_version'=>'2.2.2'
              );
              $_DB_mysqldump_path = '/usr/bin/mysqldump';
              $_DB_dbms = 'mysqli';
              include $file;
              $all = get_defined_vars(); $result = array();
              foreach ($all as $name=>$value) if ($name==='MESSAGE' || strpos($name,'LANG')===0) $result[$name]=$value;
              return $result;
          }
          function walkSame($en,$fr,$path,&$out) {
              if (is_array($en) && is_array($fr)) {
                  foreach ($en as $k=>$v) if (array_key_exists($k,$fr)) walkSame($v,$fr[$k],$path.'['.var_export($k,true).']',$out);
                  return;
              }
              if (!is_string($en) || !is_string($fr) || $en !== $fr) return;
              $t = trim(strip_tags($en));
              if ($t === '' || strlen($t) < 4) return;
              $allow = array('Geeklog','MySQL','OAuth','OpenID','Spam-X','Gravatar','Trackback','Pingback','JavaScript','GitHub','Google','Microsoft','Yahoo','Facebook','Twitter','LinkedIn','PEAR','HTML','XHTML','URL','IP','PHP','SQL','Cron','UTF-8','RSS','Atom','LDAP','SMTP','TLS','SSL','OK','Root');
              if (in_array($t,$allow,true)) return;
              $out[] = $path . ' => ' . $en;
          }
          $en=loadLanguageFile('core/2.2.2/english_utf-8.php');
          $fr=loadLanguageFile('core/2.2.2/french_france_utf-8.php');
          $out=array();
          foreach ($en as $name=>$value) if (isset($fr[$name])) walkSame($value,$fr[$name],'$'.$name,$out);
          file_put_contents('core/2.2.2/UNTRANSLATED-CANDIDATES.txt', implode(PHP_EOL,$out).PHP_EOL);
          echo count($out) . " possible untranslated strings found.\n";
          PHP

      - name: Commit untranslated candidate report
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/2.2.2/UNTRANSLATED-CANDIDATES.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Audit untranslated Geeklog 2.2.2 French strings'
            git push
          fi
