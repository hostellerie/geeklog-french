name: Rerun targeted Geeklog 2.2.2 French translation

on:
  push:
    paths: ['.github/workflows/translate-french-222-targeted-rerun.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted translation pass tolerantly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/translate-french-222-targeted.yml').read_text(encoding='utf-8').splitlines()
          collecting = False
          code = []
          for line in src:
              if line.strip() == "python3 - <<'PY'":
                  collecting = True
                  continue
              if collecting and line.strip() == 'PY':
                  break
              if collecting:
                  code.append(line[10:] if line.startswith('          ') else line)
          text = '\n'.join(code) + '\n'
          text = text.replace("raise SystemExit('Expected text not found:\\n' + old)", "return")
          Path('/tmp/targeted.py').write_text(text, encoding='utf-8')
          PY
          python3 /tmp/targeted.py
          php -l core/2.2.2/french_france_utf-8.php
      - name: Commit targeted translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/2.2.2/french_france_utf-8.php
          if ! git diff --cached --quiet; then
            git commit -m 'Complete dynamic and configuration French translations for Geeklog 2.2.2'
            git push
          fi
