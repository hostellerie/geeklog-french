name: Final validation Geeklog 2.2.2 French translation

# Revalidate after the 2.2.2 translation pass.
on:
  push:
    paths:
      - 'core/2.2.2/english_utf-8.php'
      - 'core/2.2.2/french_france_utf-8.php'
      - '.github/workflows/validate-french-222-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          php -l core/2.2.2/english_utf-8.php
          php -l core/2.2.2/french_france_utf-8.php

      - name: Validate structure and create untranslated report
        run: |
          cat > /tmp/validate.php <<'PHP'
          <?php
          define('XHTML', ' /');
          define('VERSION', '2.2.2');
          define('TOPIC_ALL_OPTION', 'all');
          define('TOPIC_HOMEONLY_OPTION', 'homeonly');
          define('TOPIC_SELECTED_OPTION', 'selected');
          define('LIKES_BLOCK_DISPLAY_ALL', 0);
          define('LIKES_BLOCK_DISPLAY_LIKE', 1);
          define('LIKES_BLOCK_DISPLAY_DISLIKE', 2);

          function loadLang($file) {
              $_CONF = array(
                  'site_url'=>'https://example.invalid', 'site_admin_url'=>'https://example.invalid/admin',
                  'site_name'=>'Example', 'commentspeedlimit'=>45, 'speedlimit'=>45,
                  'backup_path'=>'/tmp/backups/', 'path_html'=>'/tmp/', 'path_system'=>'/tmp/',
                  'path_images'=>'/tmp/', 'invalidloginattempts'=>5, 'invalidloginmaxtime'=>1200,
                  'theme_site_default'=>'modern_curve', 'theme'=>'modern_curve',
                  'min_theme_gl_version'=>'2.2.2', 'theme_gl_version'=>'2.2.2'
              );
              $_DB_mysqldump_path='/usr/bin/mysqldump'; $_DB_dbms='mysqli';
              include $file;
              $vars=get_defined_vars(); $out=array();
              foreach ($vars as $n=>$v) if ($n==='MESSAGE' || strpos($n,'LANG')===0) $out[$n]=$v;
              return $out;
          }
          function ph($v) {
              if (!is_string($v)) return array();
              preg_match_all('/%(?:\d+\$)?[-+0-9.]*[A-Za-z]/',$v,$m); sort($m[0]); return $m[0];
          }
          function values($a) { $v=array_values($a); sort($v); return $v; }
          function cmpv($en,$fr,$p,&$err) {
              if (is_array($en)) {
                  if (!is_array($fr)) { $err[]="$p: French value is not an array"; return; }
                  foreach ($en as $k=>$v) {
                      if (!array_key_exists($k,$fr)) { $err[]="$p: missing key ".var_export($k,true); continue; }
                      cmpv($v,$fr[$k],$p.'['.var_export($k,true).']',$err);
                  }
                  foreach ($fr as $k=>$v) if (!array_key_exists($k,$en)) $err[]="$p: extra key ".var_export($k,true);
                  return;
              }
              if (ph($en)!==ph($fr)) $err[]="$p: placeholder mismatch EN=".json_encode(ph($en)).' FR='.json_encode(ph($fr));
          }
          function same($en,$fr,$p,&$out) {
              if (is_array($en) && is_array($fr)) {
                  foreach ($en as $k=>$v) if (array_key_exists($k,$fr)) same($v,$fr[$k],$p.'['.var_export($k,true).']',$out);
                  return;
              }
              if (!is_string($en) || !is_string($fr) || $en!==$fr) return;
              $t=trim(strip_tags($en)); if ($t==='' || strlen($t)<4) return;
              $allow=array('Geeklog','MySQL','OAuth','OpenID','Spam-X','Gravatar','Trackback','Pingback','JavaScript','GitHub','Google','Microsoft','Yahoo','Facebook','Twitter','LinkedIn','PEAR','HTML','XHTML','URL','PHP','SQL','Cron','UTF-8','RSS','Atom','LDAP','SMTP','TLS','SSL','Root','Theme','Plugin','Plugins','Cache','Cookie','Cookies');
              if (in_array($t,$allow,true)) return;
              $out[]=$p.' => '.$en;
          }

          $en=loadLang('core/2.2.2/english_utf-8.php');
          $fr=loadLang('core/2.2.2/french_france_utf-8.php');
          $err=array();
          foreach ($en as $n=>$v) {
              if (!array_key_exists($n,$fr)) { $err[]="Missing variable \$$n"; continue; }
              if ($n==='LANG_configselects') {
                  foreach ($v as $section=>$selects) {
                      if (!isset($fr[$n][$section])) { $err[]="Missing configselect section $section"; continue; }
                      foreach ($selects as $i=>$options) {
                          if (!array_key_exists($i,$fr[$n][$section])) { $err[]="Missing configselect $section/$i"; continue; }
                          if (values($options)!==values($fr[$n][$section][$i])) $err[]="Configselect technical values differ at $section/$i";
                      }
                  }
                  continue;
              }
              cmpv($v,$fr[$n],'$'.$n,$err);
          }
          foreach ($fr as $n=>$v) if (!array_key_exists($n,$en)) $err[]="Extra variable \$$n";
          if ($err) { fwrite(STDERR,implode(PHP_EOL,$err).PHP_EOL); exit(1); }

          $same=array(); foreach ($en as $n=>$v) if (isset($fr[$n])) same($v,$fr[$n],'$'.$n,$same);
          file_put_contents('core/2.2.2/UNTRANSLATED-CANDIDATES.txt',implode(PHP_EOL,$same).PHP_EOL);
          echo "Structure, technical values and placeholders match. Possible untranslated strings: ".count($same).PHP_EOL;
          PHP
          php /tmp/validate.php

      - name: Terminology audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('core/2.2.2/french_france_utf-8.php').read_text(encoding='utf-8').lower()
          bad={'prévisualiser':'Aperçu','courriel':'email','e-mail':'email','télévers':'envoi/envoyer','rubrique':'catégorie'}
          found=[f'{k} → {v}' for k,v in bad.items() if k in text]
          if found: raise SystemExit('Terminology inconsistencies:\n'+'\n'.join(found))
          print('Terminology audit passed.')
          PY

      - name: Commit untranslated candidate report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/2.2.2/UNTRANSLATED-CANDIDATES.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Audit Geeklog 2.2.2 untranslated French strings'
            git push
          fi
