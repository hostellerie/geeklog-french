name: Clean Geeklog 2.2.2 French translation

on:
  push:
    paths: ['.github/workflows/cleanup-french-222.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean historical French typos and wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/2.2.2/french_france_utf-8.php')
          s=p.read_text(encoding='utf-8')
          fixes={
              "'Rejeté' => 0": "'Rejeter' => 0",
              "'Conserver le dernier' => 1": "'Conserver uniquement le plus récent' => 1",
              "'Permettre les posts multiples' => 2": "'Autoriser plusieurs publications' => 2",
              "'Véricier l\\'IP et l\\'URL du site'": "'Vérifier l\\'IP et l\\'URL du site'",
              "'Vérifier l\\IP et l\\'URL complète'": "'Vérifier l\\'IP et l\\'URL complète'",
              "'Vérifier l\\'IP, l\\'UR complète et l\\'URL du site'": "'Vérifier l\\'IP, l\\'URL complète et l\\'URL du site'",
              "'A plat' => 'flat'": "'À plat' => 'flat'",
              "'Nichés' => 'nested'": "'Imbriqués' => 'nested'",
              "'Regroupés' => 'threaded'": "'En fil de discussion' => 'threaded'",
              "'Non affichés' => 'nocomment'": "'Aucun commentaire' => 'nocomment'",
              "'Lecture-Ecriture' => 3": "'Lecture-écriture' => 3",
              "'Contourner' => 0": "'Ignorer' => 0",
              "'Permettre avec limitation' => 1": "'Autoriser avec limitation' => 1",
              "'Permettre, pas de limitation' => 2": "'Autoriser sans limitation' => 2",
              "'Numérique' => 'sortnum'": "'Par numéro' => 'sortnum'",
              "'Non autorisé' => 0": "'Désactivé' => 0",
              "'Autorisé (Exact Match)' => 1": "'Activé (correspondance exacte)' => 1",
              "'Autorisé (Word Beginning)' => 2": "'Activé (début de mot)' => 2",
              "'Autorisé (Word Fragment)' => 3": "'Activé (fragment de mot)' => 3",
              "'Un de ces mots' => 'any'": "'N’importe lequel des mots' => 'any'",
              "'Activé (Par défaut pour la page principale seulement)' => 2": "'Activé (par défaut uniquement pour la page d’accueil)' => 2",
              "'Pas d\\'accès' => 0": "'Aucun accès' => 0",
              "'Utilisation possible' => 2": "'Utiliser' => 2",
              "'Liste articles' => 'list'": "'Afficher la liste' => 'list'",
              "'Page administration' => 'admin'": "'Afficher l’administration' => 'admin'",
              "'Retour à la page' => 'item'": "'Rediriger vers la page' => 'item'"
          }
          for old,new in fixes.items():
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          php -l core/2.2.2/french_france_utf-8.php
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/2.2.2/french_france_utf-8.php
          if ! git diff --cached --quiet; then
            git commit -m 'Clean French terminology and legacy typos in Geeklog 2.2.2'
            git push
          fi
