name: Validate Geeklog 2.1.1 French translation

on:
  push:
    paths:
      - 'core/2.1.1/english_utf-8.php'
      - 'core/2.1.1/french_france_utf-8.php'
      - '.github/workflows/lint-french-211.yml'
  pull_request:
    paths:
      - 'core/2.1.1/english_utf-8.php'
      - 'core/2.1.1/french_france_utf-8.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize French translation syntax and terminology
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/2.1.1/french_france_utf-8.php')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "Prévisualiser les modifications de la soumission": "Aperçu des modifications de la soumission",
              "Prévisualiser les modifications": "Aperçu des modifications",
              "<p><b>PRÉVISUALISATION</b> : pour prévisualiser un article": "<p><b>APERÇU</b> : pour afficher l'aperçu d'un article",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          out = []
          state = 'normal'
          i = 0

          def is_letter(ch):
              return bool(ch) and ch.isalpha()

          while i < len(text):
              c = text[i]
              n = text[i + 1] if i + 1 < len(text) else ''
              p = text[i - 1] if i > 0 else ''

              if state == 'normal':
                  if c == "'": state = 'single'
                  elif c == '"': state = 'double'
                  elif c == '/' and n == '/': state = 'line_comment'
                  elif c == '#': state = 'line_comment'
                  elif c == '/' and n == '*': state = 'block_comment'
                  out.append(c)
              elif state == 'single':
                  if c == '\\':
                      out.append(c)
                      if i + 1 < len(text):
                          i += 1
                          out.append(text[i])
                  elif c == "'":
                      if is_letter(p) and is_letter(n): out.append("\\'")
                      else:
                          out.append(c)
                          state = 'normal'
                  else: out.append(c)
              elif state == 'double':
                  out.append(c)
                  if c == '\\' and i + 1 < len(text):
                      i += 1
                      out.append(text[i])
                  elif c == '"': state = 'normal'
              elif state == 'line_comment':
                  out.append(c)
                  if c == '\n': state = 'normal'
              elif state == 'block_comment':
                  out.append(c)
                  if c == '*' and n == '/':
                      i += 1
                      out.append('/')
                      state = 'normal'
              i += 1

          fixed = ''.join(out)
          if fixed != path.read_text(encoding='utf-8'):
              path.write_text(fixed, encoding='utf-8')
          PY

      - name: Lint PHP language files
        run: |
          php -l core/2.1.1/english_utf-8.php
          php -l core/2.1.1/french_france_utf-8.php

      - name: Audit French terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('core/2.1.1/french_france_utf-8.php').read_text(encoding='utf-8').lower()
          forbidden = {
              'prévisualiser': 'use « Aperçu » for Preview',
              'prévisualisation': 'use « Aperçu » for Preview',
              'courriel': 'use « email »',
              'e-mail': 'use « email »',
              'télévers': 'use « envoi » / « envoyer »',
              'rubrique': 'use « catégorie » for Geeklog Topic',
          }
          errors = [f'{term}: {rule}' for term, rule in forbidden.items() if term in text]
          if errors:
              raise SystemExit('Terminology inconsistencies:\n' + '\n'.join(errors))
          print('French terminology audit passed.')
          PY

      - name: Compare arrays, keys and placeholders with English source
        run: |
          php <<'PHP'
          <?php
          define('XHTML', ' /');
          function loadLanguageFile($file) {
              $_CONF = array('site_url'=>'https://example.invalid','site_admin_url'=>'https://example.invalid/admin','site_name'=>'Example','commentspeedlimit'=>45,'speedlimit'=>45,'backup_path'=>'/tmp/backups/');
              $_DB_mysqldump_path = '/usr/bin/mysqldump';
              include $file;
              $all = get_defined_vars();
              $result = array();
              foreach ($all as $name => $value) if ($name === 'MESSAGE' || strpos($name, 'LANG') === 0) $result[$name] = $value;
              return $result;
          }
          function placeholders($value) {
              if (!is_string($value)) return array();
              preg_match_all('/%(?:\d+\$)?[-+0-9.]*[A-Za-z]/', $value, $m);
              sort($m[0]);
              return $m[0];
          }
          function normalizedValues($array) { $values=array_values($array); sort($values); return $values; }
          $errors = array();
          function compareValue($en, $fr, $path, &$errors) {
              if (is_array($en)) {
                  if (!is_array($fr)) { $errors[]="$path: French value is not an array"; return; }
                  foreach ($en as $key=>$value) {
                      if (!array_key_exists($key,$fr)) { $errors[]="$path: missing French key ".var_export($key,true); continue; }
                      compareValue($value,$fr[$key],$path.'['.var_export($key,true).']',$errors);
                  }
                  foreach ($fr as $key=>$value) if (!array_key_exists($key,$en)) $errors[]="$path: extra French key ".var_export($key,true);
                  return;
              }
              if (placeholders($en)!==placeholders($fr)) $errors[]="$path: placeholder mismatch EN=".json_encode(placeholders($en)).' FR='.json_encode(placeholders($fr));
          }
          $en=loadLanguageFile('core/2.1.1/english_utf-8.php');
          $fr=loadLanguageFile('core/2.1.1/french_france_utf-8.php');
          foreach ($en as $name=>$value) {
              if (!array_key_exists($name,$fr)) { $errors[]="Missing French variable \$$name"; continue; }
              if ($name==='LANG_configselects') {
                  foreach ($value as $section=>$selects) {
                      if (!isset($fr[$name][$section])) { $errors[]="Missing French configselect section $section"; continue; }
                      foreach ($selects as $index=>$options) {
                          if (!array_key_exists($index,$fr[$name][$section])) { $errors[]="Missing French configselect index $section/$index"; continue; }
                          if (normalizedValues($options)!==normalizedValues($fr[$name][$section][$index])) $errors[]="Configselect technical values differ at $section/$index";
                      }
                      foreach ($fr[$name][$section] as $index=>$options) if (!array_key_exists($index,$selects)) $errors[]="Extra French configselect index $section/$index";
                  }
                  continue;
              }
              compareValue($value,$fr[$name],'$'.$name,$errors);
          }
          foreach ($fr as $name=>$value) if (!array_key_exists($name,$en)) $errors[]="Extra French variable \$$name";
          if ($errors) { fwrite(STDERR,implode(PHP_EOL,$errors).PHP_EOL); exit(1); }
          echo "French structure, technical select values and printf-style placeholders match the English source.\n";
          PHP

      - name: Commit automatic normalization repairs
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- core/2.1.1/french_france_utf-8.php; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add core/2.1.1/french_france_utf-8.php
            git commit -m 'Normalize French translation terminology'
            git push
          fi
