name: Build Geeklog 2.2.2 French translation

on:
  push:
    paths:
      - 'core/2.2.2/french_france_upstream_utf-8.php'
      - 'core/2.1.1/french_france_utf-8.php'
      - 'core/2.1.1/english_utf-8.php'
      - 'core/2.2.2/english_utf-8.php'
      - '.github/workflows/build-french-222.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge validated 2.1.1 translations into 2.2.2 upstream French
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def parse(path):
              lines = Path(path).read_text(encoding='utf-8').splitlines(True)
              entries = {}
              current = None
              stack = []
              for i, line in enumerate(lines):
                  mvar = re.match(r'^(\$[A-Za-z0-9_]+)\s*=\s*array\s*\(\s*$', line.strip())
                  if mvar:
                      current = mvar.group(1)
                      stack = []
                      continue
                  if current is None:
                      continue
                  stripped = line.strip()
                  if stripped == ');':
                      if stack:
                          stack.pop()
                      else:
                          current = None
                      continue
                  if stripped in ('),', ')'):
                      if stack:
                          stack.pop()
                      continue

                  m = re.match(r'^(\s*)(.+?)\s*=>\s*(.*?)(,?)\s*$', line.rstrip('\r\n'))
                  if not m:
                      continue
                  indent, key, rhs, comma = m.groups()
                  key = key.strip()
                  pathkey = (current,) + tuple(stack) + (key,)
                  entries[pathkey] = {
                      'line': i,
                      'rhs': rhs.strip(),
                      'indent': indent,
                      'key': key,
                      'comma': comma,
                      'newline': '\r\n' if line.endswith('\r\n') else '\n',
                  }
                  # Only push arrays that open here and do not close on the same line.
                  if re.match(r'^array\s*\(\s*$', rhs.strip()):
                      stack.append(key)
              return lines, entries

          en211_lines, en211 = parse('core/2.1.1/english_utf-8.php')
          fr211_lines, fr211 = parse('core/2.1.1/french_france_utf-8.php')
          en222_lines, en222 = parse('core/2.2.2/english_utf-8.php')
          fr222_lines, fr222 = parse('core/2.2.2/french_france_upstream_utf-8.php')

          def norm(s):
              return re.sub(r'\s+', ' ', s.strip())

          replaced = 0
          for p, e222 in en222.items():
              # Config select labels use translated labels as PHP keys; keep 2.2.2 upstream structure there.
              if p[0] == '$LANG_configselects':
                  continue
              if p not in en211 or p not in fr211 or p not in fr222:
                  continue
              if norm(en211[p]['rhs']) != norm(e222['rhs']):
                  continue
              f211 = fr211[p]
              f222 = fr222[p]
              idx = f222['line']
              old = fr222_lines[idx]
              newline = '\r\n' if old.endswith('\r\n') else '\n'
              new = f222['indent'] + f222['key'] + ' => ' + f211['rhs'] + f222['comma'] + newline
              if new != old:
                  fr222_lines[idx] = new
                  replaced += 1

          text = ''.join(fr222_lines)
          text = text.replace("$LANG_ISO639_1 = 'en';", "$LANG_ISO639_1 = 'fr';")
          text = text.replace('# This is the French language file for Geeklog', '# French language file for Geeklog 2.2.2')
          Path('core/2.2.2/french_france_utf-8.php').write_text(text, encoding='utf-8')
          print(f'Inherited {replaced} validated 2.1.1 translations into 2.2.2.')
          PY

      - name: Lint generated French language file
        run: php -l core/2.2.2/french_france_utf-8.php

      - name: Commit generated 2.2.2 French language file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/2.2.2/french_france_utf-8.php
          if ! git diff --cached --quiet; then
            git commit -m 'Create French translation for Geeklog 2.2.2'
            git push
          fi
