name: Diagnose Geeklog 2.2.2 French mismatches
on:
  push:
    paths: ['.github/workflows/diagnose-french-222.yml']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > /tmp/d.php <<'PHP'
          <?php
          define('XHTML',' /'); define('VERSION','2.2.2');
          define('TOPIC_ALL_OPTION','all'); define('TOPIC_HOMEONLY_OPTION','homeonly'); define('TOPIC_SELECTED_OPTION','selected');
          define('LIKES_BLOCK_DISPLAY_ALL',0); define('LIKES_BLOCK_DISPLAY_LIKE',1); define('LIKES_BLOCK_DISPLAY_DISLIKE',2);
          function loadx($f){$_CONF=['site_url'=>'x','site_admin_url'=>'x','site_name'=>'x','commentspeedlimit'=>45,'speedlimit'=>45,'backup_path'=>'/tmp/','path_html'=>'/tmp/','path_system'=>'/tmp/','path_images'=>'/tmp/','invalidloginattempts'=>5,'invalidloginmaxtime'=>1200,'theme_site_default'=>'modern_curve','theme'=>'modern_curve','min_theme_gl_version'=>'2.2.2','theme_gl_version'=>'2.2.2'];$_DB_mysqldump_path='/usr/bin/mysqldump';$_DB_dbms='mysqli';include $f;return get_defined_vars();}
          $e=loadx('core/2.2.2/english_utf-8.php'); $f=loadx('core/2.2.2/french_france_utf-8.php');
          foreach ([['LANG08',29],['LANG28',85]] as $p){[$n,$k]=$p; echo "$n[$k]\nEN: ".var_export($e[$n][$k],true)."\nFR: ".var_export($f[$n][$k],true)."\n\n";}
          foreach ([43,46] as $i){echo "LANG_configselects Core/$i\nEN: ".var_export($e['LANG_configselects']['Core'][$i],true)."\nFR: ".var_export($f['LANG_configselects']['Core'][$i],true)."\n\n";}
          PHP
          php /tmp/d.php
