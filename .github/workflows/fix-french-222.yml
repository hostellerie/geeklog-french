name: Fix Geeklog 2.2.2 French translation

on:
  push:
    paths: ['.github/workflows/fix-french-222.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply required 2.2.2 corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/2.2.2/french_france_utf-8.php')
          s=p.read_text(encoding='utf-8')
          replacements={
              '29 => "Bonjour. Voici les derniers articles publiés sur le site {$_CONF[\'site_name\']} le ",': '29 => "Voici le résumé quotidien de {$_CONF[\'site_name\']} pour le %s. Vous trouverez ci-dessous les derniers articles publiés depuis le précédent envoi de cet email.",',
              "85 => 'Si vous avez oublié votre mot de passe, utilisez le lien suivant : %s',": "85 => 'Si vous avez oublié votre mot de passe, utilisez le lien suivant : ',",
              "43 => array('All' => 'all', 'Homepage Only' => 'homeonly', 'Select Topics' => 'selectedtopics'),": "43 => array('Toutes' => 'all', 'Page d\\'accueil uniquement' => 'homeonly', 'Sélectionner les catégories' => 'selected'),",
              "46 => array('Likes and Dislikes' => 3, 'Likes Only' => 1, 'Dislikes Only' => 2)": "46 => array('J’aime et Je n’aime pas' => 0, 'J’aime uniquement' => 1, 'Je n’aime pas uniquement' => 2)"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected source text not found: '+old)
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          php -l core/2.2.2/french_france_utf-8.php
      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/2.2.2/french_france_utf-8.php
          git commit -m 'Fix Geeklog 2.2.2 French placeholders and config values'
          git push
