name: Analyze Geeklog 2.2.2 language changes

on:
  push:
    paths:
      - 'core/2.2.2/english_utf-8.php'
      - '.github/workflows/analyze-222-language-diff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build language diff report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib

          a = Path('core/2.1.1/english_utf-8.php').read_text(encoding='utf-8').splitlines()
          b = Path('core/2.2.2/english_utf-8.php').read_text(encoding='utf-8').splitlines()

          diff = list(difflib.unified_diff(a, b, fromfile='Geeklog 2.1.1', tofile='Geeklog 2.2.2', lineterm=''))
          added = [x[1:] for x in diff if x.startswith('+') and not x.startswith('+++')]
          removed = [x[1:] for x in diff if x.startswith('-') and not x.startswith('---')]

          report = []
          report.append('# Geeklog 2.1.1 → 2.2.2 English language changes')
          report.append('')
          report.append(f'- Added/changed lines in 2.2.2: {len(added)}')
          report.append(f'- Removed/changed lines from 2.1.1: {len(removed)}')
          report.append('')
          report.append('## Added or changed lines in 2.2.2')
          report.append('```php')
          report.extend(added)
          report.append('```')
          report.append('')
          report.append('## Removed or changed lines from 2.1.1')
          report.append('```php')
          report.extend(removed)
          report.append('```')
          report.append('')
          Path('core/2.2.2/LANGUAGE-DIFF-2.1.1.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/2.2.2/LANGUAGE-DIFF-2.1.1.md
          if ! git diff --cached --quiet; then
            git commit -m 'Document Geeklog 2.2.2 language changes'
            git push
          fi
